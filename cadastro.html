<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastre-se</title>
    <link rel="stylesheet" href="stytles.css">
</head>
<body>
    <div class="form-container">
        <form class="formulario-cadastro">
            <fieldset>
                <legend>CADASTRO</legend>

                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input
                        type="text"
                        name="nome"
                        id="nome"
                        placeholder=" " required>
                </div>  

                <div class="campo">
                    <label for="cpf">CPF:</label>
                    <input
                        type="text"
                        name="cpf"
                        id="cpf"
                        pattern="[0-9]{11}"
                        maxlength="11"
                        placeholder=" " required>
                </div>

                <div class="campo">
                    <label for="nascimento">Data de Nascimento</label>
                    <input
                        type="date"
                        name="nascimento"
                        id="nascimento"
                        placeholder=" " required>
                </div>

                <div class="campo campo-cep">
                    <label for="cep">CEP:</label>
                    <div class="campo-cep-grupo">
                        <input
                            type="text"
                            name="cep"
                            id="cep"
                            maxlength="9"
                            placeholder=" " required>
                        <button type="button" class="botao-cep">Buscar CEP</button>
                    </div>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder=" " required>
                </div>

                <div class="campo">
                    <label for="tel">Telefone:</label>
                    <input
                        type="tel"
                        name="tel"
                        id="tel"
                        pattern="[0-9]{11}"
                        maxlength="11"
                        placeholder=" " required>
                </div>

                <button id="botaocadastro" type="submit" class="botao-enviar">Cadastrar</button>
                <p id="boasvindas"></p>
            </fieldset>
        </form>
    </div>
<script src="script.js"></script>
</body>
</html>
